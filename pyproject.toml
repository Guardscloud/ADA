[project]
name = "ada-agi"
version = "0.3.14"
description = "ADA - beyaz yaka işlerini yapan otonom yapay zeka çalışanı"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "ddgs>=9.16.0",
    "fastapi>=0.142.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openai>=3.22.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pyobjc-framework-applicationservices>=12.2.2; sys_platform == 'darwin'",
    "pyotp>=2.10.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pywebview>=6.2.1",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "qrcode[pil]>=8.2",
    "reportlab>=5.0.1",
    "socksio>=1.0.0",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ada = "ada.server:main"
ada-app = "ada.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ada"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
